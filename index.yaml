    description: 'Axera cluster agent for one Kubernetes cluster (OpenShift, k3s,
      RKE2 / Rancher, Anthos, or vanilla kubeadm): one DaemonSet in namespace "axera"
      that runs the eBPF flow agent, the flow pipeline, the process sensor and the
      shipper, sending flow and process telemetry to a central Axera platform through
      Kafka, with an optional packet-capture sidecar, an optional API audit forwarder,
      and the integration ServiceAccount used to register the cluster in Axera.'

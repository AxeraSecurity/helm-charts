{{- $tls := include "axeraforce.tls" . -}}
{{- $sasl := include "axeraforce.sasl" . -}}
{{- $hasCA := and $tls .Values.kafka.caCert -}}
{{- if and .Values.kafka.createSecret $hasCA }}
# Broker CA (TLS trust; kafka.createSecret: true only), mounted at /etc/kafka-certs by both writers.
apiVersion: v1
kind: Secret
metadata:
  name: kafka-ca
  namespace: {{ .Release.Namespace }}
  labels: {{- include "axeraforce.labels" . | nindent 4 }}
type: Opaque
stringData:
  ca.crt: |
{{ .Values.kafka.caCert | indent 4 }}
{{- end }}
{{- if and .Values.kafka.createSecret $sasl }}
---
# SASL credentials (kafka.createSecret: true only). The flow pipeline reads them as files under
# /etc/kafka-sasl (and trims them); the shipper reads them via env VERBATIM, so they are trimmed
# here: a trailing newline would fail the shipper's login like a wrong password.
# kafka.createSecret: false (the default) -> bring your own Secret named kafka-sasl (bare values,
# no trailing newline; kubectl create secret ... --from-literal adds none).
apiVersion: v1
kind: Secret
metadata:
  name: kafka-sasl
  namespace: {{ .Release.Namespace }}
  labels: {{- include "axeraforce.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.kafka.saslUsername | trim | quote }}
  password: {{ .Values.kafka.saslPassword | trim | quote }}
{{- end }}

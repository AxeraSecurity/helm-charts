apiVersion: v2
name: axera
description: >-
  Axera — Kubernetes microsegmentation and network detection & response (NDR).
  The central platform (console, API, flow analytics, policy engine) for
  OpenShift, k3s, RKE2 / Rancher, Anthos and vanilla Kubernetes. Maps east-west
  and egress flows, turns observed traffic into least-privilege NetworkPolicy
  and raises incidents. Observes first and enforces nothing until you choose.
  Runs all-internal (PostgreSQL + Kafka in the namespace) or against your own
  PostgreSQL and Kafka. Pair it with the axera-force chart on every monitored
  cluster.
type: application
# Chart version (SemVer): bump on every chart change.
version: 3.0.0
# Axera platform version deployed by default.
appVersion: "17.2.0"
# OpenShift 4.12+, k3s, RKE2 and GKE releases with Kubernetes 1.25 or newer.
kubeVersion: ">=1.25.0-0"
home: https://axerasecurity.com
sources:
  - https://github.com/AxeraSecurity/helm-charts
icon: https://axerasecurity.github.io/helm-charts/axera-logo.svg
keywords:
  - microsegmentation
  - network-detection-and-response
  - ndr
  - kubernetes-network-policy
  - zero-trust
  - security
  - openshift
  - k3s
  - rke2
  - rancher
  - anthos
maintainers:
  - name: Axera Security
    email: support@axerasecurity.com
    url: https://axerasecurity.com
annotations:
  # Red Hat OpenShift certified-chart metadata (charts.openshift.io/*).
  charts.openshift.io/name: Axera Microsegmentation & NDR
  charts.openshift.io/provider: Axera Security
  charts.openshift.io/supportURL: https://axerasecurity.com/support
  charts.openshift.io/archs: amd64

# CENTRAL shape: the platform on one cluster, the axera-force agent on many, all producing to your
# Kafka (SASL_SSL) and the platform storing in your PostgreSQL. Layer it over the profile of the
# central cluster's distribution (it sets global.distribution). Work on a copy, outside the
# extracted chart (a later helm pull --untar overwrites edits made in place):
#
#   cp axera/examples/values-central-external.yaml my-central.yaml
#   helm upgrade --install axera axera/axera -n axera-central \
#     -f axera/profiles/values-openshift.yaml -f axera/profiles/values-external-data.yaml \
#     -f my-central.yaml
#
# Secrets created beforehand in axera-central (keys: README, "Secrets"):
#   axera-db         APP_DB_CONNSTR / RADAR_DB_CONNSTR etc. for the external PostgreSQL
#   axera-kafka      the Kafka bootstrap, protocol, SASL mechanism / user / password and CA
# The application Secret (JWT key, admin password, encryption keys) is still generated by the chart.
#
# Each agent cluster, in this order (README, "(b) Central platform, remote agents"):
#   1. Kafka: create the topics <cluster> (3 partitions) and <cluster>-process (1), plus
#      <cluster>-dns with DNS visibility, retention.ms=7200000; external-flows once for all clusters.
#      Grant the agent's and the platform's principals their ACLs (README, "Kafka topics").
#      Radar runs in Verify mode here and never creates a topic; records sent to a missing topic
#      are dropped.
#   2. kubectl create namespace axera
#      kubectl label namespace axera pod-security.kubernetes.io/enforce=privileged \
#        pod-security.kubernetes.io/audit=privileged pod-security.kubernetes.io/warn=privileged
#   3. Secrets kafka-ca and kafka-sasl in "axera" (the axera-force README, "Create the Kafka Secrets";
#      its pods stay Init:0/1 (ContainerCreating) until they exist).
#   4. A small per-cluster values file (a comma inside --set would split the broker list):
#        # cluster-a.yaml
#        clusterName: cluster-a
#        kafka: { bootstrapServers: "broker1:9093,broker2:9093,broker3:9093" }
#      helm upgrade --install axera-force axera/axera-force -n axera \
#        -f axera-force/profiles/values-<distribution>.yaml -f cluster-a.yaml
#      (no --create-namespace: step 2 created it with its labels)
#   5. Add the cluster to kafka.clusters in my-central.yaml and helm upgrade the platform with the
#      same -f files.
#   6. Register it in the UI with that cluster's direct API URL and its axera/axera-sa-token token,
#      under the same name as clusterName.
#   Audit stream (optional, auditForwarder in the agent chart): targetUri
#   https://<audit host>/api/Internal/Audit, where <audit host> is routes.api.host (default
#   api-axera-central.<global.clusterDomain>) with the OpenShift Route, or expose.frontend.host with
#   expose.auditIngest on Ingress / Istio. internalToken = key Internal__Token of
#   axera-central/axera-app-secret:
#     kubectl -n axera-central get secret axera-app-secret -o jsonpath='{.data.Internal__Token}' | base64 -d

postgres:
  external: true
  appDbConnString: ""            # read from secrets.existingSecrets.db
  radarConnString: ""
  # SslMode=VerifyCA / VerifyFull against a private CA (a Secret with ca.crt in this namespace):
  caSecret: ""

kafka:
  external: true
  bootstrapServers: ""           # read from secrets.existingSecrets.kafka
  securityProtocol: SaslSsl
  saslMechanism: ScramSha512
  saslUsername: ""
  saslPassword: ""
  # Every agent cluster by its registered name.
  clusters:
    - cluster-a
    - cluster-b
  # Radar only checks and reports the topics; your Kafka team creates them (step 1 above).
  topicProvisioning:
    mode: Verify

secrets:
  existingSecrets:
    db: axera-db
    kafka: axera-kafka

app:
  dpKeysStore: Database

# Remote agents post the cluster API audit stream to the platform on ONE exact path,
# /api/Internal/Audit (token-guarded): through the path-scoped Route on OpenShift ...
routes:
  api:
    enabled: true
# ... and on the UI host through the Ingress or Istio front door elsewhere. Leave it false with a
# Route front door (OpenShift) or a LoadBalancer one (refused: it cannot route by path).
expose:
  auditIngest:
    enabled: false

{{- include "axera.init" . }}
{{- define "axera.trialBootstrapJobSpec" -}}
ttlSecondsAfterFinished: 86400
backoffLimit: 10
template:
  metadata:
    labels:
      app: trial-bootstrap
      {{- with include "axera.jobPodSidecarLabel" . }}
      {{- . | nindent 6 }}
      {{- end }}
    {{- with include "axera.jobPodSidecarAnnotation" . }}
    annotations:
      {{- . | nindent 6 }}
    {{- end }}
  spec:
    serviceAccountName: axera-sa
    {{- with (include "axera.scheduling" (dict "component" "jobs" "ctx" .) | trim) }}{{ . | nindent 4 }}{{- end }}
    restartPolicy: OnFailure
    initContainers:
      - name: wait-for-license-table
        image: {{ include "axera.postgresImage" . }}
        {{- with include "axera.pgClientSecurityContext" . }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with (.Values.resources).initContainers }}
        resources: {{- toYaml . | nindent 10 }}
        {{- end }}
        env:
          - name: PGPASSWORD
            valueFrom: { secretKeyRef: { name: {{ include "axera.dbSecretName" . }}, key: POSTGRES_PASSWORD } }
          - name: PGUSER
            valueFrom: { secretKeyRef: { name: {{ include "axera.dbSecretName" . }}, key: POSTGRES_USER } }
          - name: PGDATABASE
            valueFrom: { secretKeyRef: { name: {{ include "axera.dbSecretName" . }}, key: APP_DB_NAME } }
          {{- if .Values.postgres.external }}
          - name: PG_CONNSTR
            valueFrom: { secretKeyRef: { name: {{ include "axera.dbSecretName" . }}, key: APP_DB_CONNSTR } }
          {{- include "axera.pgCaEnv" . | nindent 10 }}
          {{- else }}
          - { name: PGHOST, value: "postgres-app" }
          {{- end }}
        command:
          - sh
          - -c
          - |
            set -e
            {{- if .Values.postgres.external }}
            {{- include "axera.pgConnStrEnv" . | nindent 12 }}
            {{- end }}
            # Wait until db-migrate-jobs have created the LicenseInfos table
            n=0
            until err=$(psql -tAXc 'SELECT 1 FROM "LicenseInfos" LIMIT 0' 2>&1 >/dev/null); do
              # Every 20th try, the reason (a connection or TLS error shows up here, not only a
              # missing table).
              if [ $((n % 20)) -eq 0 ]; then echo "[trial-init] $(echo "$err" | head -n 1)"; fi
              n=$((n + 1))
              echo "[trial-init] LicenseInfos not ready yet, sleeping 3s..."
              sleep 3
            done
            echo "[trial-init] LicenseInfos table available."
        {{- with include "axera.pgCaMount" . }}
        {{- . | nindent 8 }}
        {{- end }}
    containers:
      - name: bootstrap
        image: {{ include "axera.postgresImage" . }}
        {{- with include "axera.pgClientSecurityContext" . }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with (.Values.resources).jobs }}
        resources: {{- toYaml . | nindent 10 }}
        {{- end }}
        env:
          - name: PGPASSWORD
            valueFrom: { secretKeyRef: { name: {{ include "axera.dbSecretName" . }}, key: POSTGRES_PASSWORD } }
          - name: PGUSER
            valueFrom: { secretKeyRef: { name: {{ include "axera.dbSecretName" . }}, key: POSTGRES_USER } }
          - name: PGDATABASE
            valueFrom: { secretKeyRef: { name: {{ include "axera.dbSecretName" . }}, key: APP_DB_NAME } }
          {{- if .Values.postgres.external }}
          - name: PG_CONNSTR
            valueFrom: { secretKeyRef: { name: {{ include "axera.dbSecretName" . }}, key: APP_DB_CONNSTR } }
          {{- include "axera.pgCaEnv" . | nindent 10 }}
          {{- else }}
          - { name: PGHOST, value: "postgres-app" }
          {{- end }}
          - { name: TRIAL_DAYS,      value: "{{ .Values.licensing.trial.days }}" }
          - { name: TRIAL_MAX_NODES, value: "{{ .Values.licensing.trial.maxWorkerNodes }}" }
          - { name: TRIAL_CUSTOMER,  value: "{{ .Values.licensing.trial.customer }}" }
          # `default` treats 0 as empty in Helm, so `licensing.trial.edition: 0` used to render as 2 and
          # an Observe trial was impossible to seed. `kindIs` distinguishes "unset" from "set to zero".
          - { name: TRIAL_EDITION,  value: "{{ if kindIs "invalid" .Values.licensing.trial.edition }}2{{ else }}{{ .Values.licensing.trial.edition }}{{ end }}" }
        command:
          - sh
          - -c
          - |
            set -e
            {{- if .Values.postgres.external }}
            {{- include "axera.pgConnStrEnv" . | nindent 12 }}
            {{- end }}

            COUNT=$(psql -tAXc 'SELECT COUNT(*) FROM "LicenseInfos";')
            if [ "$COUNT" -gt 0 ]; then
              echo "[trial] LicenseInfos already has $COUNT row(s) — skipping bootstrap."
              exit 0
            fi

            echo "[trial] Seeding ${TRIAL_DAYS}-day trial license for '${TRIAL_CUSTOMER}'..."
            psql -v ON_ERROR_STOP=1 <<SQL
            INSERT INTO "LicenseInfos" (
              "Id", "LicenseKey", "ExpirationDate", "IsActive",
              "CreatedAt", "ActivatedAt",
              "Customer", "MaxWorkerNodes", "ClusterUid",
              "IssuedBy", "IssuedAt", "LastValidatedAt",
              "ValidationStatus", "LastObservedNodeCount", "Edition"
            ) VALUES (
              gen_random_uuid(), '', now() + interval '${TRIAL_DAYS} days', true,
              now(), now(),
              '${TRIAL_CUSTOMER}', ${TRIAL_MAX_NODES}, NULL,
              'system-bootstrap', now(), now(),
              'Trial', NULL, ${TRIAL_EDITION:-2}
            );
            SQL
            echo "[trial] Trial license seeded (${TRIAL_DAYS} days, max ${TRIAL_MAX_NODES} nodes)."
        {{- with include "axera.pgCaMount" . }}
        {{- . | nindent 8 }}
        {{- end }}
    {{- with include "axera.pgCaVolume" . }}
    {{- . | nindent 4 }}
    {{- end }}
{{- end }}
{{- if and .Values.licensing.trial.enabled .Values.postgres.runMigrations }}
{{/*
  Trial license bootstrap. Runs once after migration jobs and seeds a
  signature-less "Trial" license row when LicenseInfos is empty.
  Idempotent: re-runs are a no-op once any license (trial or real) exists.
*/}}
{{- /* Named by a hash of its own spec: a Job whose pod template changes under the same name is refused ("field is immutable"). A changed spec is a new Job; Helm removes the superseded one. */}}
{{- $jobSpec := include "axera.trialBootstrapJobSpec" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: axera-trial-bootstrap-{{ $jobSpec | sha1sum | trunc 8 }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: trial-bootstrap
    {{- include "axera.labels" . | nindent 4 }}
spec:
{{ $jobSpec | indent 2 }}
{{- end }}

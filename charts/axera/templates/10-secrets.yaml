{{- include "axera.init" . -}}
{{- /* =========================================================================
     Secrets: database, application and Kafka.

     Every secret value resolves as:
       values override  >  existing Secret (stable across `helm upgrade`)  >  generated
     so values.yaml carries no secret at all and every install gets its own:
       postgres.password       randAlphaNum 24 (both connection strings are built from it)
       app.accessTokenSecret   randAlphaNum 64 (HS512 JWT signing key: 512 bits minimum)
       app.encryptionKey       randBytes 32    (base64, AES-256 key)
       app.encryptionIV        randBytes 16    (base64, AES IV)
       app.secretsEncryptionKey randBytes 32   (base64; third-party credentials at rest)
       app.adminPassword       randAlphaNum 16 + "!Aa1"
       app.internalToken       randAlphaNum 48 (pod-to-pod /api/Internal shared secret)
     The encryption keys and IV MUST stay stable or the encrypted data in the database becomes
     unreadable; hence the read-back from the existing Secret, and helm.sh/resource-policy: keep
     so `helm uninstall` leaves the Secrets in place.

     GitOps (Argo CD renders with `helm template`, where lookup answers empty): every render would
     generate NEW values. Set secrets.create=false there and pre-create the three Secrets (keys
     exactly as below), or name your own with secrets.existingSecrets.{db,app,kafka}; a Secret
     named there is not rendered at all.

     Connection values follow the same rule with "empty" instead of "generated" (external
     PostgreSQL connection strings, external Kafka bootstrap servers, SASL credentials, CA), read
     back only from a Secret of the SAME data tier (annotations
     platform.axerasecurity.com/postgres-tier, platform.axerasecurity.com/kafka-tier; the 2.0.0
     package recorded them as axera.io/*, which are still read). Changing the tier is refused by
     00-validate.yaml unless dataTier.allowChange=true.
========================================================================= */ -}}
{{- $createSecrets := true -}}
{{- if and .Values.secrets (kindIs "bool" .Values.secrets.create) -}}
{{-   $createSecrets = .Values.secrets.create -}}
{{- end -}}
{{- if $createSecrets -}}
{{- $ns := .Values.global.namespace -}}
{{- $existing := (.Values.secrets | default dict).existingSecrets | default dict -}}
{{- $pgTier    := include "axera.pgTier" . -}}
{{- $kafkaTier := include "axera.kafkaTier" . -}}
{{- $pgSameTier    := eq (include "axera.pgTierRecorded" .) $pgTier -}}
{{- $kafkaSameTier := eq (include "axera.kafkaTierRecorded" .) $kafkaTier -}}
{{- $dbData  := (lookup "v1" "Secret" $ns "axera-db-secrets").data  | default dict -}}
{{- $appData := (lookup "v1" "Secret" $ns "axera-app-secret").data  | default dict -}}
{{- $kafkaData := (lookup "v1" "Secret" $ns "kafka-external-secret").data | default dict -}}
{{- /* postgres.user: values, else the existing Secret, else "postgres" (the 2.x chart shipped an
     empty default and resolved it the same way). */ -}}
{{- $pgUser := .Values.postgres.user | default "" | toString -}}
{{- if not $pgUser }}{{- $pgUser = (index $dbData "POSTGRES_USER" | default "" | b64dec) -}}{{- end -}}
{{- if not $pgUser }}{{- $pgUser = "postgres" -}}{{- end -}}
{{- $pgPass := .Values.postgres.password -}}
{{- if not $pgPass }}{{- $pgPass = (index $dbData "POSTGRES_PASSWORD" | default "" | b64dec) -}}{{- end -}}
{{- if not $pgPass }}{{- $pgPass = randAlphaNum 24 -}}{{- end -}}
{{- $appConn := "" -}}
{{- $radarConn := "" -}}
{{- if .Values.postgres.external -}}
{{- /* An external database's connection strings are values > existing Secret: values that leave
     them out keep the live ones instead of blanking them. */ -}}
{{-   $appConn = .Values.postgres.appDbConnString -}}
{{-   if and (not $appConn) $pgSameTier }}{{- $appConn = (index $dbData "APP_DB_CONNSTR" | default "" | b64dec) -}}{{- end -}}
{{-   $radarConn = .Values.postgres.radarConnString -}}
{{-   if and (not $radarConn) $pgSameTier }}{{- $radarConn = (index $dbData "RADAR_DB_CONNSTR" | default "" | b64dec) -}}{{- end -}}
{{-   if and (not $existing.db) (or (not $appConn) (not $radarConn)) -}}
{{-     fail "postgres.external=true needs postgres.appDbConnString and postgres.radarConnString on the first install (an upgrade keeps them from the existing axera-db-secrets when left out), or a Secret of your own (secrets.existingSecrets.db, or secrets.create=false)." -}}
{{-   end -}}
{{- else -}}
{{-   $appConn = printf "Host=postgres-app;Port=5432;Database=%s;Username=%s;Password=%s" .Values.postgres.appDbName $pgUser $pgPass -}}
{{-   $radarConn = printf "Host=postgres-radar;Port=5432;Database=%s;Username=%s;Password=%s" .Values.postgres.radarDbName $pgUser $pgPass -}}
{{- end -}}
{{- $ats := .Values.app.accessTokenSecret -}}
{{- if not $ats }}{{- $ats = (index $appData "AccessTokenSecret" | default "" | b64dec) -}}{{- end -}}
{{- if not $ats }}{{- $ats = randAlphaNum 64 -}}{{- end -}}
{{- if and .Values.app.accessTokenSecret (lt (len .Values.app.accessTokenSecret) 64) -}}
{{-   fail "app.accessTokenSecret must be at least 64 characters: tokens are signed with HMAC-SHA512, which needs a 512-bit key. Leave it empty to have one generated." -}}
{{- end -}}
{{- $encKey := .Values.app.encryptionKey -}}
{{- if not $encKey }}{{- $encKey = (index $appData "Encryption__Key" | default "" | b64dec) -}}{{- end -}}
{{- if not $encKey }}{{- $encKey = randBytes 32 -}}{{- end -}}
{{- $encIV := .Values.app.encryptionIV -}}
{{- if not $encIV }}{{- $encIV = (index $appData "Encryption__IV" | default "" | b64dec) -}}{{- end -}}
{{- if not $encIV }}{{- $encIV = randBytes 16 -}}{{- end -}}
{{- /* The dedicated key the services encrypt third-party credentials with at rest (registered
     clusters' tokens, integration passwords, security-feed secrets). Same resolution as above, so
     an upgrade of an install that predates it generates it once and every later render reads it
     back. It must never change after credentials were written with it: they would read as not set
     until entered again. */ -}}
{{- $secKey := .Values.app.secretsEncryptionKey -}}
{{- if not $secKey }}{{- $secKey = (index $appData "Secrets__EncryptionKey" | default "" | b64dec) -}}{{- end -}}
{{- if not $secKey }}{{- $secKey = randBytes 32 -}}{{- end -}}
{{- $adminPass := .Values.app.adminPassword -}}
{{- if not $adminPass }}{{- $adminPass = (index $appData "AdminCredentials__Password" | default "" | b64dec) -}}{{- end -}}
{{- if not $adminPass }}{{- $adminPass = printf "%s!Aa1" (randAlphaNum 16) -}}{{- end -}}
{{- $intTok := .Values.app.internalToken -}}
{{- if not $intTok }}{{- $intTok = (index $appData "Internal__Token" | default "" | b64dec) -}}{{- end -}}
{{- if not $intTok }}{{- $intTok = randAlphaNum 48 -}}{{- end -}}
{{- /* Kafka credentials and CA: values > existing Secret (never generated). Values that leave them
     out keep the live ones instead of blanking the SASL login and the broker CA. */ -}}
{{- $kafkaBootstrap := include "axera.kafkaBootstrap" . -}}
{{- $kafkaProtocol := include "axera.kafkaSecurityProtocol" . -}}
{{- $kafkaUser := .Values.kafka.saslUsername | default "" -}}
{{- $kafkaPass := .Values.kafka.saslPassword | default "" -}}
{{- $kafkaCA := .Values.kafka.caCert | default "" -}}
{{- $kafkaMech := .Values.kafka.saslMechanism | default "" -}}
{{- if $kafkaSameTier -}}
{{-   if and .Values.kafka.external (not $kafkaBootstrap) }}{{- $kafkaBootstrap = (index $kafkaData "Kafka__BootstrapServers" | default (index $kafkaData "KafkaServer") | default "" | b64dec) -}}{{- end -}}
{{-   if not $kafkaUser }}{{- $kafkaUser = (index $kafkaData "Kafka__SaslUsername" | default "" | b64dec) -}}{{- end -}}
{{-   if not $kafkaPass }}{{- $kafkaPass = (index $kafkaData "Kafka__SaslPassword" | default "" | b64dec) -}}{{- end -}}
{{-   if not $kafkaCA }}{{- $kafkaCA = (index $kafkaData "ca.crt" | default "" | b64dec) -}}{{- end -}}
{{-   if not $kafkaMech }}{{- $kafkaMech = (index $kafkaData "Kafka__SaslMechanism" | default "" | b64dec) -}}{{- end -}}
{{- end -}}
{{- if and .Values.kafka.external (not $existing.kafka) -}}
{{-   if not $kafkaBootstrap -}}
{{-     fail "kafka.external=true needs kafka.bootstrapServers on the first install (an upgrade keeps it from the existing kafka-external-secret when left out), or a Secret of your own (secrets.existingSecrets.kafka, or secrets.create=false)." -}}
{{-   end -}}
{{-   if and (has $kafkaProtocol (list "SaslPlaintext" "SaslSsl")) (or (not $kafkaUser) (not $kafkaPass) (not $kafkaMech)) -}}
{{-     fail (printf "kafka.securityProtocol=%s needs kafka.saslMechanism (Plain | ScramSha256 | ScramSha512), kafka.saslUsername and kafka.saslPassword on the first install (an upgrade keeps them from the existing kafka-external-secret when left out): without them Radar cannot authenticate to the broker (an empty mechanism falls back to Kerberos)." $kafkaProtocol) -}}
{{-   end -}}
{{- end }}
{{- if not $existing.db }}
apiVersion: v1
kind: Secret
metadata:
  name: axera-db-secrets
  namespace: {{ $ns }}
  labels: {{- include "axera.labels" . | nindent 4 }}
  # keep: `helm uninstall` leaves this Secret, so a reinstall finds the same database password
  # instead of generating one the existing database does not know. The annotations
  # platform.axerasecurity.com/postgres-tier and platform.axerasecurity.com/postgres-flavor record
  # where and how the data lives (00-validate.yaml).
  annotations:
    helm.sh/resource-policy: keep
    platform.axerasecurity.com/postgres-tier: {{ $pgTier | quote }}
    {{- if not .Values.postgres.external }}
    platform.axerasecurity.com/postgres-flavor: {{ include "axera.pgFlavor" . | quote }}
    {{- end }}
type: Opaque
stringData:
  POSTGRES_USER: {{ $pgUser | quote }}
  POSTGRES_PASSWORD: {{ $pgPass | quote }}
  APP_DB_NAME: {{ .Values.postgres.appDbName | quote }}
  RADAR_DB_NAME: {{ .Values.postgres.radarDbName | quote }}
  APP_DB_CONNSTR: {{ $appConn | quote }}
  RADAR_DB_CONNSTR: {{ $radarConn | quote }}
{{- end }}
{{- if not $existing.app }}
---
apiVersion: v1
kind: Secret
metadata:
  name: axera-app-secret
  namespace: {{ $ns }}
  labels: {{- include "axera.labels" . | nindent 4 }}
  # keep: the JWT key, the admin password and above all the encryption key/IV survive a
  # reinstall (data encrypted with a lost key cannot be read back).
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  AccessTokenSecret: {{ $ats | quote }}
  AdminCredentials__Username: {{ .Values.app.adminUsername | quote }}
  AdminCredentials__Email: {{ .Values.app.adminEmail | quote }}
  AdminCredentials__Password: {{ $adminPass | quote }}
  Encryption__Key: {{ $encKey | quote }}
  Encryption__IV: {{ $encIV | quote }}
  Secrets__EncryptionKey: {{ $secKey | quote }}
  Internal__Token: {{ $intTok | quote }}
{{- end }}
{{- if not $existing.kafka }}
---
apiVersion: v1
kind: Secret
metadata:
  name: kafka-external-secret
  namespace: {{ $ns }}
  labels: {{- include "axera.labels" . | nindent 4 }}
  # keep: it may hold your Kafka SASL credentials and CA. The annotation
  # platform.axerasecurity.com/kafka-tier records which broker this installation runs on
  # (00-validate.yaml).
  annotations:
    helm.sh/resource-policy: keep
    platform.axerasecurity.com/kafka-tier: {{ $kafkaTier | quote }}
type: Opaque
stringData:
  KafkaServer: {{ $kafkaBootstrap | quote }}
  Kafka__BootstrapServers: {{ $kafkaBootstrap | quote }}
  Kafka__SecurityProtocol: {{ $kafkaProtocol | quote }}
  Kafka__SaslMechanism: {{ $kafkaMech | quote }}
  Kafka__SaslUsername: {{ $kafkaUser | quote }}
  Kafka__SaslPassword: {{ $kafkaPass | quote }}
  # If a CA is provided (or kept from the existing Secret), point librdkafka to the mounted file;
  # else leave empty so it falls back to the system CA bundle.
  Kafka__SslCaLocation: {{ if $kafkaCA }}"/etc/kafka-certs/ca.crt"{{ else }}""{{ end }}
  ca.crt: {{ $kafkaCA | quote }}
{{- end }}
{{- end }}
{{- /*
  ── Mesh verdict ingest tokens (sidecar / waypoint Envoy access logs) ──────────────────────────
  One shared secret per cluster, read by Radar as MeshMonitoring:IngestTokens:<cluster>, from its
  own Secret axera-mesh-ingest-tokens (Radar loads it with envFrom, optional).

  WHY A TOKEN AT ALL. The sidecar and waypoint lanes are PUSH: Radar cannot follow one pods/log
  per application pod without opening thousands of concurrent watches against the customer's
  apiserver, which was rejected as an availability risk. So the mesh pushes instead, and the
  token is what tells Radar WHICH cluster a batch came from — the body never says. The endpoint
  refuses every post that does not carry a configured secret, and refuses all of them when none
  is configured.

  KEY NAME. The cluster name goes into the key verbatim, hyphens and all:
  MeshMonitoring__IngestTokens__<cluster-name>. Kubernetes accepts a hyphen in an env-var name
  and .NET maps the "__" segments back to configuration keys, so the round trip works; a failure
  here would be silent (the lane would keep reporting NOT CONFIGURED).

  The name MUST be the cluster name exactly as it is registered in Axera — the same string the
  Mesh pages' cluster picker shows. A token filed under a name that matches no registered
  cluster arms nothing.

  OWN SECRET, `data:` NOT `stringData:`. A key removed from stringData is never removed from the
  live Secret (Helm's patch only nulls the write-only stringData), so a revoked token would stay
  accepted. Under data a removed entry is deleted, and with no token left the Secret itself is
  removed. Its own Secret also keeps the tokens working with secrets.existingSecrets.app.
*/}}
{{- /*
  Earlier instructions named `app.mesh.ingestTokens`.
  No such value exists, and Helm ignores unknown values WITHOUT A WORD — an operator would follow
  the instructions, see a clean install, and get a lane that never arms and never explains itself.
  Refuse the render instead, and name the real path.
*/}}
{{- if ((.Values.app).mesh).ingestTokens }}
  {{- fail "app.mesh.ingestTokens is not a value this chart reads — it is a stale path from an older README and Helm would have ignored it silently, leaving the sidecar/waypoint verdict lane NOT CONFIGURED. Move the map to meshMonitoring.ingestTokens (same shape: registered cluster name -> token)." }}
{{- end }}
{{- $meshTokens := (.Values.meshMonitoring).ingestTokens | default dict }}
{{- range $cluster, $token := $meshTokens }}
  {{- if not (kindIs "string" $token) }}
    {{- fail (printf "meshMonitoring.ingestTokens.%s must be a string" $cluster) }}
  {{- end }}
  {{- if lt (len (trim $token)) 16 }}
    {{- fail (printf "meshMonitoring.ingestTokens.%s is shorter than the 16-character minimum Radar enforces — it would be rejected at startup and the lane would stay NOT CONFIGURED. Generate one with: openssl rand -hex 32" $cluster) }}
  {{- end }}
{{- end }}
{{- if $meshTokens }}
{{- if not $createSecrets }}
  {{- fail (printf "meshMonitoring.ingestTokens is ignored with secrets.create=false (the chart renders no Secret): add MeshMonitoring__IngestTokens__<cluster> keys to your Secret %s instead, and remove meshMonitoring.ingestTokens." (include "axera.appSecretName" .)) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: axera-mesh-ingest-tokens
  namespace: {{ .Values.global.namespace }}
  labels: {{- include "axera.labels" . | nindent 4 }}
type: Opaque
data:
{{- range $cluster, $token := $meshTokens }}
  MeshMonitoring__IngestTokens__{{ $cluster }}: {{ trim $token | b64enc | quote }}
{{- end }}
{{- end }}

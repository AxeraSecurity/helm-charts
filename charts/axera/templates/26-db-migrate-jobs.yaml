{{- include "axera.init" . }}
{{- /* =========================================================================
     The migrate Job spec of one database. Usage:
       include "axera.migrateJobSpec" (dict "target" "app" "ctx" .)    (MicrosegmentationDB)
       include "axera.migrateJobSpec" (dict "target" "radar" "ctx" .)  (AxeraRadarDB)
     Both containers only need psql / pg_isready and run the PostgreSQL flavour's image.
     External PostgreSQL: the Npgsql connection string becomes the libpq environment
     (axera.pgConnStrEnv: SslMode → PGSSLMODE; verify modes trust postgres.caSecret, else the
     system CA bundle).
========================================================================= */}}
{{- define "axera.migrateJobSpec" -}}
{{- $ctx := .ctx -}}
{{- $isApp := eq .target "app" -}}
{{- $host := ternary "postgres-app" "postgres-radar" $isApp -}}
{{- $dbKey := ternary "APP_DB_NAME" "RADAR_DB_NAME" $isApp -}}
{{- $connKey := ternary "APP_DB_CONNSTR" "RADAR_DB_CONNSTR" $isApp -}}
{{- $dbLabel := ternary "MicrosegmentationDB" "AxeraRadarDB" $isApp -}}
{{- $dbSecret := include "axera.dbSecretName" $ctx -}}
{{- $u := $ctx.Values.postgres.user | default "postgres" -}}
ttlSecondsAfterFinished: 86400
backoffLimit: 20
template:
  metadata:
    labels:
      app: db-migrate
      target: {{ .target }}
      {{- with include "axera.jobPodSidecarLabel" $ctx }}
      {{- . | nindent 6 }}
      {{- end }}
    {{- with include "axera.jobPodSidecarAnnotation" $ctx }}
    annotations:
      {{- . | nindent 6 }}
    {{- end }}
  spec:
    serviceAccountName: axera-sa
    {{- with (include "axera.scheduling" (dict "component" "jobs" "ctx" $ctx) | trim) }}{{ . | nindent 4 }}{{- end }}
    restartPolicy: OnFailure
    initContainers:
      - name: wait-for-db
        image: {{ include "axera.postgresImage" $ctx }}
        {{- with include "axera.pgClientSecurityContext" $ctx }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with ($ctx.Values.resources).initContainers }}
        resources: {{- toYaml . | nindent 10 }}
        {{- end }}
        env:
          - name: PGPASSWORD
            valueFrom: { secretKeyRef: { name: {{ $dbSecret }}, key: POSTGRES_PASSWORD } }
        command:
          - sh
          - -c
          - |
            {{- if $ctx.Values.postgres.external }}
            # External PostgreSQL: the migrate container reports a connection failure itself.
            echo "[wait] external PostgreSQL reachable check (best-effort)..."
            {{- else }}
            until pg_isready -h {{ $host }} -p 5432 -U {{ $u }}; do
              echo "[wait] {{ $host }} not ready, sleeping 2s..."; sleep 2;
            done
            {{- end }}
            echo "[wait] DB reachable, proceeding to migrations."
    containers:
      - name: migrate
        image: {{ include "axera.postgresImage" $ctx }}
        {{- with include "axera.pgClientSecurityContext" $ctx }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with ($ctx.Values.resources).jobs }}
        resources: {{- toYaml . | nindent 10 }}
        {{- end }}
        env:
          - name: PGPASSWORD
            valueFrom: { secretKeyRef: { name: {{ $dbSecret }}, key: POSTGRES_PASSWORD } }
          - name: PGUSER
            valueFrom: { secretKeyRef: { name: {{ $dbSecret }}, key: POSTGRES_USER } }
          - name: PGDATABASE
            valueFrom: { secretKeyRef: { name: {{ $dbSecret }}, key: {{ $dbKey }} } }
          {{- if $ctx.Values.postgres.external }}
          - name: PG_CONNSTR
            valueFrom: { secretKeyRef: { name: {{ $dbSecret }}, key: {{ $connKey }} } }
          {{- include "axera.pgCaEnv" $ctx | nindent 10 }}
          {{- else }}
          - { name: PGHOST, value: {{ $host | quote }} }
          {{- end }}
        command:
          - sh
          - -c
          - |
            set -e
            echo "[migrate] applying the {{ $dbLabel }} migrations..."
            {{- if $ctx.Values.postgres.external }}
            {{- include "axera.pgConnStrEnv" $ctx | nindent 12 }}
            echo "[migrate] Connecting to ${PGUSER}@${PGHOST}:${PGPORT:-5432}/${PGDATABASE} (sslmode ${PGSSLMODE:-prefer})"
            {{- end }}
            psql -v ON_ERROR_STOP=1 -f /sql/init.sql
            echo "[migrate] done."
        volumeMounts:
          - { name: sql, mountPath: /sql, readOnly: true }
          {{- if and $ctx.Values.postgres.external $ctx.Values.postgres.caSecret }}
          - { name: pg-ca, mountPath: /etc/axera/pg-ca, readOnly: true }
          {{- end }}
    volumes:
      - name: sql
        configMap:
          name: {{ ternary "axera-db-init" "radar-db-init" $isApp }}
          items: [ { key: init.sql, path: init.sql } ]
      {{- if and $ctx.Values.postgres.external $ctx.Values.postgres.caSecret }}
      - name: pg-ca
        secret: { secretName: {{ $ctx.Values.postgres.caSecret }}, items: [{ key: ca.crt, path: ca.crt }] }
      {{- end }}
{{- end }}
{{- if .Values.postgres.runMigrations }}
{{/*
  Migration Jobs are regular resources (not Helm hooks) so they appear in `helm get manifest` and
  `kubectl get jobs` immediately. Job names carry a hash of the SQL and of the Job's own spec
  (image, env), so any change renders a NEW Job name: the old immutable Job is never patched, a
  fresh one runs, and Helm removes the superseded Job. Old Jobs persist for
  ttlSecondsAfterFinished (24h) for log inspection. The init container waits for PostgreSQL.
*/}}
{{- $appSpec := include "axera.migrateJobSpec" (dict "target" "app" "ctx" .) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: axera-db-migrate-{{ printf "%s|%s" $appSpec (.Files.Get "sql/app-init.sql") | sha1sum | trunc 8 }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: db-migrate
    target: app
    {{- include "axera.labels" . | nindent 4 }}
spec:
{{ $appSpec | indent 2 }}
---
{{- $radarSpec := include "axera.migrateJobSpec" (dict "target" "radar" "ctx" .) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: radar-db-migrate-{{ printf "%s|%s" $radarSpec (.Files.Get "sql/radar-init.sql") | sha1sum | trunc 8 }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: db-migrate
    target: radar
    {{- include "axera.labels" . | nindent 4 }}
spec:
{{ $radarSpec | indent 2 }}
{{- end }}
